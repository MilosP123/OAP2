name: AGN notebook checks

on:
  push:
    paths:
      - 'Projekat/**'
      - '.github/workflows/agn-checks.yml'
  pull_request:
    paths:
      - 'Projekat/**'
      - '.github/workflows/agn-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: Projekat
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: Projekat/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python -m nbqa pylint Untitled7.ipynb --errors-only
      - run: python -m nbqa pylint Untitled7.ipynb --fail-under=5
      - run: python -m pylint tools/check_notebook.py --errors-only
      - name: Restart and Run All in a fresh kernel, synthetic data
        run: python tools/check_notebook.py
